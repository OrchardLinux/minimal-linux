name: Build Minimal Linux
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      hardware_tag:
        description: Published orchard release supplying the compiled components
        required: true
        default: v0.2.0
      hardware_run_id:
        description: Optional exact hardware run supplying first-release components
        required: false
      reuse_base_run_id:
        description: Exact prior run supplying the unchanged Alpine base
        required: false
      reuse_artwork_run_id:
        description: Exact prior run supplying unchanged loader artwork
        required: false
      reuse_loader_run_id:
        description: Exact prior run supplying the tested unchanged loader
        required: false
permissions:
  contents: read
  actions: read
env:
  HARDWARE_TAG: ${{ inputs.hardware_tag || 'v0.2.0' }}
  HARDWARE_ARTIFACT_DIR: ${{ inputs.hardware_run_id != '' && 'out/downloads/hardware' || '' }}
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: '[[ "$TAG" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]*$ ]]'
      # Tests follow orchard main; builds use the pinned orchard release (ci/dependencies).
      - run: bash ci/dependencies --tools-only
        env:
          ORCHARD_REF: main
      - run: .venv/bin/python -m unittest discover -s tests -v
  # Pongo is not built here: releases ship hardware's one Pongo (quiet/pongo.bin).
  artwork:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Reuse the unchanged loader artwork
        if: inputs.reuse_artwork_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: minimal-boot-inputs
          path: out
          run-id: ${{ inputs.reuse_artwork_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.reuse_artwork_run_id == ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.reuse_artwork_run_id == ''
        with:
          python-version: '3.14'
      - run: brew install imagemagick librsvg
        if: inputs.reuse_artwork_run_id == ''
      - name: Generate the loader artwork
        if: inputs.reuse_artwork_run_id == ''
        run: |
          python boot/generate-logo.py --output out/boot/alpine-logo.h
          tar -C out -czf out/boot-inputs.tar.gz boot
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-boot-inputs
          path: out/boot-inputs.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  loader:
    needs: artwork
    runs-on: ubuntu-24.04-arm
    container: debian:bookworm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      ORCHARD_BUILD_NATIVE: '1'
      ORCHARD_BUILD_ENV_ID: debian-bookworm-arm64-llvm19-rust1.90.0
      RUSTUP_TOOLCHAIN: '1.90.0'
    steps:
      - name: Reuse the tested unchanged loader
        if: inputs.reuse_loader_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: minimal-loader
          path: out
          run-id: ${{ inputs.reuse_loader_run_id }}
          github-token: ${{ github.token }}
      - run: apt-get update && apt-get install -y git curl ca-certificates python3 python3-venv
        if: inputs.reuse_loader_run_id == ''
      - uses: actions/checkout@v4
        if: inputs.reuse_loader_run_id == ''
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: inputs.reuse_loader_run_id == ''
        with:
          name: minimal-boot-inputs
          path: out/downloads
      - if: inputs.reuse_loader_run_id == ''
        run: |
          bash ci/dependencies --tools-only
          bash .orchard/boot/m1n1/install-toolchain
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          tar -xzf out/downloads/boot-inputs.tar.gz -C out
      - name: Build branded loader with the shared recipe
        if: inputs.reuse_loader_run_id == ''
        run: |
          python boot/build-loader.py --logo-header out/boot/alpine-logo.h --output out/boot/m1n1.bin
          python boot/m1n1/test-splash.py
          tar -C out -czf out/distro-boot.tar.gz boot
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-loader
          path: out/distro-boot.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  base:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Reuse the unchanged signed Alpine base
        if: inputs.reuse_base_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: minimal-base
          path: out
          run-id: ${{ inputs.reuse_base_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        if: inputs.reuse_base_run_id == ''
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        if: inputs.reuse_base_run_id == ''
        with:
          python-version: '3.14'
      - run: sudo apt-get update && sudo apt-get install -y skopeo umoci
        if: inputs.reuse_base_run_id == ''
      - run: bash ci/dependencies --tools-only
        if: inputs.reuse_base_run_id == ''
      - name: Build the pinned Alpine base without a container daemon
        if: inputs.reuse_base_run_id == ''
        run: |
          mkdir -p out/base
          sudo "$PWD/.venv/bin/python" build_base.py --native --output out/base/base.tar.gz
          tar -C out -czf out/alpine-base.tar.gz base
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-base
          path: out/alpine-base.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  assets:
    needs: [test, artwork, loader, base]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          pattern: minimal-*
          path: out/downloads
          merge-multiple: true
      - name: Await the exact hardware run without rebuilding components
        if: inputs.hardware_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HARDWARE_RUN_ID: ${{ inputs.hardware_run_id }}
        run: |
          [[ "$HARDWARE_RUN_ID" =~ ^[0-9]+$ ]]
          gh run watch "$HARDWARE_RUN_ID" --repo OrchardLinux/orchard --interval 20 --exit-status
      - name: Reuse verified first-release components
        if: inputs.hardware_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: orchard-release-assets
          path: out/downloads/hardware
          repository: OrchardLinux/orchard
          run-id: ${{ inputs.hardware_run_id }}
          github-token: ${{ github.token }}
      - run: bash ci/dependencies
      - name: Assemble, audit and stage hosted assets
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_ID: ${{ github.run_id }}
        run: |
          . .venv/bin/activate
          tar -xzf out/downloads/alpine-base.tar.gz -C out
          tar -xzf out/downloads/distro-boot.tar.gz -C out
          VERSION="preview-$RUN_ID"
          TAG="v$VERSION"
          if [[ "$REF_TYPE" == tag ]]; then TAG="$REF_NAME"; VERSION="${TAG#v}"; fi
          # Every platform's kernel from orchard's bundles; the shared tools are in each.
          kernels=()
          for bundle in out/platforms/*/components; do
            kernels+=(--kernel-dir "$(basename "$(dirname "$bundle")")=$bundle/kernel")
          done
          tools=out/platforms/apple-16k/components
          python pin_components.py --loader out/boot/m1n1.bin --splash out/boot/splash --pongo "$tools/quiet/pongo.bin" \
            --busybox "$tools/boot/busybox" --dropbear "$tools/boot/dropbear" \
            --dropbearkey "$tools/boot/dropbearkey" --wpa-supplicant "$tools/boot/wpa_supplicant" \
            --wpa-cli "$tools/boot/wpa_cli" --iw "$tools/boot/iw" --output out/inputs
          python build.py --base out/base/base.tar.gz --base-receipt out/base/base.tar.gz.json \
            --inputs out/inputs/inputs.json --version "$VERSION" --output out/release "${kernels[@]}"
          python audit.py out/release
          python -m orchard.manifests --verify-local out/release/index.toml
          # The installer: install.sh and orchard-install.pyz with orchard's launch loaders.
          python -m orchard.installer release out/release \
            --pongo "$tools/quiet/pongo.bin" --m1n1 "$tools/quiet/m1n1.bin"
          python -m orchard.image.publish --distro minimal-linux --tag "$TAG" \
            --release-dir out/release --output out/publication
          cp out/release/rootfs.json out/release/build-receipt.json out/base/* out/publication/
          git archive --format=tar.gz -o out/publication/minimal-linux-source.tar.gz HEAD
          (cd out/publication && sha256sum ./* > ../SHA256SUMS && mv ../SHA256SUMS .)
      - name: Attest public build
        if: toJSON(github.event.repository.private) == 'false'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: out/publication/*
      - name: Include public attestation bundle
        if: toJSON(github.event.repository.private) == 'false'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" "out/publication/minimal-linux-build.sigstore.jsonl"
      - uses: actions/upload-artifact@v4
        with:
          name: minimal-release-assets
          path: out/publication/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  draft:
    if: github.ref_type == 'tag'
    needs: assets
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: minimal-release-assets
          path: assets
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --draft --verify-tag --title "$TAG" \
            --notes 'Experimental image. Automated build/audit checks do not replace physical-device qualification. Publish compatible shared-launcher assets before announcing launch support.'
